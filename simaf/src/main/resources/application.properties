spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:simaf}
spring.datasource.username=${POSTGRES_USER:app}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG

# Serviço Python (OpenCV/Tesseract)
scanner.url=${SCANNER_URL:http://localhost:8000}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=35MB

server.address=0.0.0.0

simaf.convite=${SIMAF_CONVITE:}